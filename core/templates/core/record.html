{% load static %}<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="csrf-token" content="{{ csrf_token }}">
  <title>Honest Ear</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'core/landing.css' %}">
  {% if recording_enabled %}<script src="{% static 'core/record.js' %}" defer></script>{% endif %}
</head>
<body>
  <main class="recorder">
    <h1 class="recorder-title">Honest Ear</h1>
    {% if recording_enabled %}
      <p id="status" class="status" role="status" aria-live="polite">Start a session to record your voice.</p>
      <p id="timer" class="timer" hidden>0:00</p>
      <div class="controls">
        <button id="start" class="btn" type="button">Start session</button>
        <button id="record" class="btn" type="button" hidden>Record</button>
        <button id="stop" class="btn btn-stop" type="button" hidden>Stop</button>
        <button id="play" class="btn" type="button" hidden>Play</button>
      </div>
    {% else %}
      <p class="status" role="status">Recording is unavailable right now. Please check back soon.</p>
    {% endif %}
  </main>
</body>
</html>
