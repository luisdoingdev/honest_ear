x-app: &app
  build: .
  env_file: .env
  volumes:
    - .:/app
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  web:
    <<: *app
    command: >
      sh -c "python manage.py compilemessages -v 0 &&
             python manage.py migrate --noinput &&
             python manage.py ensure_superuser &&
             exec python manage.py runserver 0.0.0.0:8000"
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/')"]
      interval: 5s
      timeout: 5s
      retries: 20

  e2e:
    image: mcr.microsoft.com/playwright:v1.64.1-noble
    profiles: ["test"]
    working_dir: /e2e
    entrypoint: ["sh", "/e2e/run.sh"]
    env_file: .env
    environment:
      BASE_URL: http://localhost:8000
      CI: ${CI:-}
    # Share web's network so tests use localhost: browsers only allow the microphone on HTTPS or localhost.
    network_mode: "service:web"
    ipc: host
    volumes:
      - ./e2e:/e2e
      - e2e_node_modules:/e2e/node_modules
    depends_on:
      web:
        condition: service_healthy

  celery:
    <<: *app
    command: celery -A config worker --loglevel=info

  celery-beat:
    <<: *app
    command: celery -A config beat --loglevel=info --schedule /tmp/celerybeat-schedule

  db:
    image: postgres:17
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      # Only for tools on the Mac (Django uses db:5432 inside Docker). 5433 avoids a local Postgres.
      - "${POSTGRES_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    ports:
      # Only for tools on the Mac (Django uses redis:6379 inside Docker).
      - "${REDIS_PORT:-6380}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Local CPU phoneme service (scorer/local.py), the same contract as the Modal one.
  # Opt-in: docker compose --profile scorer up -d scorer. Django reaches it at http://scorer:8000/.
  scorer:
    build: ./scorer
    profiles: ["scorer"]
    environment:
      # The same shared secret as Django's SCORER_SECRET, read from .env.
      SCORER_SECRET: ${SCORER_SECRET:-}
      SCORER_QUANTIZE: ${SCORER_QUANTIZE:-}
    volumes:
      - scorer_hf_cache:/cache
    ports:
      # Only for curl from the Mac; override with SCORER_PORT if taken.
      - "${SCORER_PORT:-8011}:8000"
    # Docker's VM is small; cap the model so it can't starve Postgres and the rest.
    mem_limit: 2500m
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 6
      # First start downloads ~1.2 GB of weights; later starts only load them.
      start_period: 600s

volumes:
  postgres_data:
  redis_data:
  e2e_node_modules:
  scorer_hf_cache:
