# Render Blueprint: declares the web service and the names of its environment variables.
# Secret values never go in this file: `generateValue` lets Render create one, and `sync: false`
# makes Render ask for the value in its dashboard when the Blueprint is first applied.
services:
  - type: web
    name: honest-ear-test
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health/
    autoDeployTrigger: checksPass
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      # The cache and Celery broker.
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: honest-ear-redis
          property: connectionString
      # The phoneme service (wav2vec2) and the transcriber (Whisper), and their shared secret (see README).
      - key: SCORER_URL
        sync: false
      - key: TRANSCRIBER_URL
        sync: false
      - key: SCORER_SECRET
        sync: false
      - key: DJANGO_SUPERUSER_USERNAME
        value: admin
      - key: DJANGO_SUPERUSER_EMAIL
        sync: false
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false
      - key: DEBUG
        value: "False"
      - key: LOG_LEVEL
        value: INFO

  - type: keyvalue
    name: honest-ear-redis
    plan: free
    # Empty: reachable only from this workspace's services, never the internet.
    ipAllowList: []
    maxmemoryPolicy: allkeys-lru
